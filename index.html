<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle Tubuh Mistik</title>
  <style>
    body {
      background-color: #1a253c;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 0;
      text-align: center;
    }
    .panel {
      background-color: #243b55;
      border-radius: 15px;
      padding: 20px;
      margin: 0 auto;
      width: 340px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      color: #f6d365;
      margin-top: 0;
      margin-bottom: 5px;
    }
    p {
      font-size: 14px;
      color: #d1d8e0;
      margin-bottom: 20px;
    }
    #puzzle-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background-color: #0d1421;
      border-radius: 8px;
    }
    .tile {
      position: absolute;
      width: 96px;
      height: 96px;
      background-image: url('https://images.unsplash.com/photo-1548625361-ec853818e69d?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80');
      background-size: 300px 300px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-size: 24px;
      font-weight: bold;
      line-height: 96px;
      text-align: center;
      text-shadow: 1px 1px 3px black;
      transition: left 0.2s, top 0.2s;
    }
    .empty-indicator {
      position: absolute;
      width: 96px;
      height: 96px;
      border: 2px dashed #888;
      border-radius: 8px;
      color: #888;
      font-size: 30px;
      line-height: 96px;
      text-align: center;
      transition: left 0.2s, top 0.2s;
    }
    .btn-glow {
      margin-top: 20px;
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
    }
    #reflectionModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.9);
      z-index: 100;
      padding-top: 50px;
    }
    .modal-content {
      background-color: #fff;
      color: #333;
      margin: 0 auto;
      width: 300px;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
    }
    .modal-content h2 {
      color: #e74c3c;
      margin-top: 0;
    }
    .btn-close {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Puzzle Altar</h1>
    <p>Geser kepingan untuk menyusun gambar!</p>
    <div id="puzzle-container">
      <div id="empty-indicator" class="empty-indicator">?</div>
    </div>
    <button class="btn-glow" onclick="showReflection()">Kenapa Gak Bisa Lengkap?</button>
  </div>

  <div id="reflectionModal">
    <div class="modal-content">
      <h2>KAMU ADALAH KEPINGANNYA!</h2>
      <p>Satu kepingan kosong membuat wajah Gereja tidak utuh.<br><br>Ketika kamu pasif atau merasa tidak penting, Gereja kehilangan bagian terbaiknya. Kehadiranmu sangat berarti!</p>
      <button class="btn-close" onclick="closeReflection()">Saya Siap Terlibat!</button>
    </div>
  </div>

  <script>
    var container = document.getElementById('puzzle-container');
    var emptyIndicator = document.getElementById('empty-indicator');
    var tileSize = 100;
    var gap = 2;
    var emptyPos = { x: 1, y: 1 };
    var tiles = [];

    function updatePos(elem, x, y) {
      elem.style.left = (x * tileSize + gap) + 'px';
      elem.style.top = (y * tileSize + gap) + 'px';
    }

    function moveTile(tile) {
      var dx = Math.abs(tile.x - emptyPos.x);
      var dy = Math.abs(tile.y - emptyPos.y);
      if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
        var oldX = tile.x;
        var oldY = tile.y;
        tile.x = emptyPos.x;
        tile.y = emptyPos.y;
        updatePos(tile.element, tile.x, tile.y);
        emptyPos.x = oldX;
        emptyPos.y = oldY;
        updatePos(emptyIndicator, emptyPos.x, emptyPos.y);
      }
    }

    function init() {
      var id = 0;
      for (var row = 0; row < 3; row++) {
        for (var col = 0; col < 3; col++) {
          if (row === 1 && col === 1) {
            updatePos(emptyIndicator, col, row);
            continue;
          }
          var tile = document.createElement('div');
          tile.className = 'tile';
          tile.style.backgroundPosition = '-' + (col * 100) + 'px -' + (row * 100) + 'px';
          id++;
          tile.innerText = id;
          
          var tileObj = { element: tile, x: col, y: row };
          
          // Closure fix untuk browser jadul
          (function(t) {
            tile.onclick = function() { moveTile(t); };
            tile.ontouchstart = function(e) { e.preventDefault(); moveTile(t); };
          })(tileObj);

          tiles.push(tileObj);
          container.appendChild(tile);
          updatePos(tile, col, row);
        }
      }
      
      // Acak Puzzle
      for (var i = 0; i < 60; i++) {
        var movable = [];
        for (var j = 0; j < tiles.length; j++) {
          var dx = Math.abs(tiles[j].x - emptyPos.x);
          var dy = Math.abs(tiles[j].y - emptyPos.y);
          if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
            movable.push(tiles[j]);
          }
        }
        var rand = movable[Math.floor(Math.random() * movable.length)];
        var ox = rand.x;
        var oy = rand.y;
        rand.x = emptyPos.x;
        rand.y = emptyPos.y;
        emptyPos.x = ox;
        emptyPos.y = oy;
      }
      for (var k = 0; k < tiles.length; k++) {
        updatePos(tiles[k].element, tiles[k].x, tiles[k].y);
      }
      updatePos(emptyIndicator, emptyPos.x, emptyPos.y);
    }

    function showReflection() {
      document.getElementById('reflectionModal').style.display = 'block';
    }

    function closeReflection() {
      document.getElementById('reflectionModal').style.display = 'none';
    }

    window.onload = init;
  </script>
</body>
</html>

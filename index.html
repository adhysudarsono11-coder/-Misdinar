<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle Tubuh Mistik - Rekoleksi Misdinar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    /* Animasi Background Bergerak */
    body {
      background: linear-gradient(-45deg, #141e30, #243b55, #4b134f, #1e3c72);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 15px;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Desain Kaca (Glassmorphism) */
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f6d365;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #d1d8e0;
      margin-bottom: 25px;
      font-weight: 400;
    }

    /* Area Puzzle */
    #puzzle-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    /* Kepingan Puzzle dengan Animasi Mulus */
    .tile {
      position: absolute;
      width: 98px; /* Sedikit lebih kecil dari 100 untuk memberi gap */
      height: 98px;
      background-image: url('https://images.unsplash.com/photo-1548625361-ec853818e69d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80'); /* Foto Altar Asli */
      background-size: 300px 300px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    }

    .tile:active {
      filter: brightness(1.2);
      z-index: 10;
    }
